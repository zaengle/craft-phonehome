name: Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The committed lockfile cannot install below 8.3: craftcms/cms 5.x requires ^8.2, but
        # lcobucci/clock pulls the floor up to ~8.3. composer.json itself still allows >=8.1.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Run tests
        run: composer test

  static-analysis:
    name: Static analysis and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Run PHPStan
        run: composer phpstan

      - name: Check coding standards
        run: composer check-cs

  # The workflows other repositories call are checked by a linter and the runner's own unit tests,
  # because the only other place a mistake in them shows up is a client's pull request.
  workflows:
    name: Workflows and runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint the workflows
        # `job.workflow_sha` is a documented context that this actionlint release does not know
        # about yet. Use a shell so the ignore pattern is passed as one argument: Docker action
        # `with.args` does not interpret shell single quotes.
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.7 \
            -color -ignore 'property "workflow_sha" is not defined in object type'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/site-verification/package-lock.json

      - name: Install the runner's dependencies
        working-directory: tools/site-verification
        run: npm ci

      # The Cloudflare Access tests drive a real browser, because what they check is which hosts
      # the browser sends the token to. Nothing else in the unit suite needs one.
      - name: Install Chromium
        working-directory: tools/site-verification
        run: npx playwright install --with-deps chromium

      - name: Run the runner's unit tests
        working-directory: tools/site-verification
        run: npx playwright test -c playwright.unit.config.ts
